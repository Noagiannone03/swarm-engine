// python -m grpc_tools.protoc -I. --python_out=.  src/parallax/p2p/proto/forward.proto

syntax = "proto3";
package gradient;

enum ForwardMode {
  EXTEND = 0;
  DECODE = 1;
  MIXED = 2;
}

message ForwardRequest {
  ForwardMode forward_mode = 1;
  repeated Req reqs = 2;
}

message ForwardResponse {
}


message AbortRequest {
  repeated Req reqs = 1;
}

message AbortResponse {
}

message Req {
  string rid = 1;
  int32 output_length = 2;
  repeated string routing_table = 3;

  repeated int32 input_ids = 4;
  SamplingParams sampling_params = 5;

  int32 next_token_id = 6;
  bytes hidden_states = 7;
  string lora_path = 8;
  optional float token_prob = 9;  // Probability value for the sampled token
  bool return_probs = 10;  // Whether to return probabilities
  bool terminal_error = 11;  // Pipeline execution failed; abort peers and return ERROR upstream
  string route_id = 12;  // Signed protocol-v3 route identity
  uint64 route_epoch = 13;  // Fencing epoch for retries/failover
  string authority_request_id = 14;  // Coordinator request identity signed into the route
  NativeActivationFrame native_activation = 15;  // Skippy activation descriptor + opaque payload
}

message NativeActivationFrame {
  uint32 version = 1;
  string dtype = 2;
  string layout = 3;
  int32 producer_stage_index = 4;
  int32 layer_start = 5;
  int32 layer_end = 6;
  uint32 token_count = 7;
  uint32 sequence_count = 8;
  uint64 flags = 9;
  bytes payload = 10;
}

message SamplingParams {
  int32 max_new_tokens = 1;
  int32 min_new_tokens = 2;
  float temperature = 3;
  float top_p = 4;
  float min_p = 5;
  int32 top_k = 6;
  repeated int32 stop_token_ids = 7;
  bool ignore_eos = 8;
  repeated string stop_strs = 9;
  float repetition_penalty = 10;
  float presence_penalty = 11;
  float frequency_penalty = 12;
  string json_schema = 13;
}
