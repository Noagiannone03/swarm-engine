name: Native network

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-network.yml'
      - 'native/fabi-network/**'
      - 'native/fabi-dxgi/**'
      - 'pyproject.toml'
      - 'src/backend/main.py'
      - 'src/backend/server/request_handler.py'
      - 'src/backend/server/request_agent_frontend.py'
      - 'src/backend/server/contribution_gate.py'
      - 'src/parallax/launch.py'
      - 'src/parallax/p2p/server.py'
      - 'src/parallax/server/executor/factory.py'
      - 'src/parallax/server/backend_capabilities.py'
      - 'src/parallax/server/memory_budget.py'
      - 'src/parallax/server/runtime_capacity.py'
      - 'src/parallax/server/server_info.py'
      - 'src/parallax/server/executor_supervision.py'
      - 'src/parallax/utils/model_config.py'
      - 'src/parallax/utils/model_download.py'
      - 'src/parallax/utils/model_artifact_cache.py'
      - 'src/parallax/utils/selective_safetensors.py'
      - 'src/parallax/utils/shared_state.py'
      - 'src/swarm_protocol/**'
      - 'tools/agentic_workload_sim/**'
      - 'tests/test_backend_request_handler.py'
      - 'tests/test_backend_capabilities.py'
      - 'tests/test_memory_budget.py'
      - 'tests/test_runtime_capacity.py'
      - 'tests/test_server_info_memory.py'
      - 'tests/test_request_agent_frontend.py'
      - 'tests/test_executor_supervision.py'
      - 'tests/test_launch.py'
      - 'tests/test_model_artifact_cache.py'
      - 'tests/test_p2p_node_info.py'
      - 'tests/test_selective_safetensors.py'
      - 'tests/test_swarm_protocol_*.py'
      - 'tests/test_agentic_workload_probe.py'
  push:
    branches:
      - codex/swarm-protocol-v3
    paths:
      - '.github/workflows/native-network.yml'
      - 'native/fabi-network/**'
      - 'native/fabi-dxgi/**'
      - 'pyproject.toml'
      - 'src/backend/main.py'
      - 'src/backend/server/request_handler.py'
      - 'src/backend/server/request_agent_frontend.py'
      - 'src/backend/server/contribution_gate.py'
      - 'src/parallax/launch.py'
      - 'src/parallax/p2p/server.py'
      - 'src/parallax/server/executor/factory.py'
      - 'src/parallax/server/backend_capabilities.py'
      - 'src/parallax/server/memory_budget.py'
      - 'src/parallax/server/runtime_capacity.py'
      - 'src/parallax/server/server_info.py'
      - 'src/parallax/server/executor_supervision.py'
      - 'src/parallax/utils/model_config.py'
      - 'src/parallax/utils/model_download.py'
      - 'src/parallax/utils/model_artifact_cache.py'
      - 'src/parallax/utils/selective_safetensors.py'
      - 'src/parallax/utils/shared_state.py'
      - 'src/swarm_protocol/**'
      - 'tools/agentic_workload_sim/**'
      - 'tests/test_backend_request_handler.py'
      - 'tests/test_backend_capabilities.py'
      - 'tests/test_memory_budget.py'
      - 'tests/test_runtime_capacity.py'
      - 'tests/test_server_info_memory.py'
      - 'tests/test_request_agent_frontend.py'
      - 'tests/test_executor_supervision.py'
      - 'tests/test_launch.py'
      - 'tests/test_model_artifact_cache.py'
      - 'tests/test_p2p_node_info.py'
      - 'tests/test_selective_safetensors.py'
      - 'tests/test_swarm_protocol_*.py'
      - 'tests/test_agentic_workload_probe.py'

permissions:
  contents: read

concurrency:
  group: native-network-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    name: Wheel and DHT tests / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]

    defaults:
      run:
        working-directory: native/fabi-network

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust 1.91
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.91'
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/fabi-network

      - name: Install Maturin
        run: python -m pip install "maturin>=1.9,<2"

      - name: Check formatting
        shell: bash
        run: |
          cargo fmt --check
          cargo fmt --manifest-path ../fabi-dxgi/Cargo.toml --check

      - name: Lint all targets and features
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test Python bindings and three-node DHT
        env:
          PYO3_PYTHON: python
        run: cargo test --features python

      - name: Test DXGI safe wrapper
        run: cargo test --manifest-path ../fabi-dxgi/Cargo.toml

      - name: Build ABI3 wheel
        env:
          PYO3_PYTHON: python
        run: python -m maturin build --release --interpreter python

      - name: Install built wheel
        run: python -m pip install --no-index --find-links target/wheels fabi-network-native

      - name: Import wheel surface
        run: >-
          python -c "import fabi_network_native as n;
          assert hasattr(n, 'CatalogRecord');
          assert hasattr(n, 'capability_public_key');
          assert hasattr(n, 'issue_route_capability');
          assert hasattr(n, 'verify_route_capability');
          assert hasattr(n, 'route_capability_root_revocation_id');
          assert hasattr(n, 'create_relay_enrollment_proof');
          assert hasattr(n, 'query_dxgi_video_memory');
          assert hasattr(n, 'DxgiVideoMemoryInfo');
          assert hasattr(n.NetworkNode, 'start_catalog_dht');
          assert hasattr(n.NetworkNode, 'catalog_put');
          assert hasattr(n.NetworkNode, 'catalog_get');
          assert hasattr(n.NetworkNode, 'catalog_get_members');
          assert hasattr(n.NetworkNode, 'catalog_get_model_members')"

      - name: Test protocol-v3 contracts, trust, discovery, and shadow integration
        shell: bash
        run: |
          python -m pip install \
            "pydantic>=2" \
            "huggingface-hub>=0.36.2,<2.0.0" \
            "hf-xet>=1.5.2,<1.6.0" \
            "filelock>=3.12" \
            "psutil>=5.9.5" \
            "safetensors>=0.5.1" \
            "numpy>=1.26" \
            "onnx==1.22.0" \
            "tuf==7.0.0" \
            "cryptography>=40.0.0" \
            "requests>=2.31" \
            "aiohttp>=3.9" \
            "fastapi>=0.115" \
            "httpx>=0.27" \
            "uvicorn>=0.30" \
            "lattica==1.0.21" \
            "msgpack>=1.0.7" \
            "protobuf>=7.35.1,<8" \
            "ddsketch==3.0.1" \
            "networkx>=3.4,<4" \
            "pytest>=8.2"
          python -m pip install --no-deps -e ../..
          cd ../..
          python -m pytest -q --noconftest \
            tests/test_swarm_protocol_*.py \
            tests/test_agentic_workload_probe.py \
            tests/test_backend_request_handler.py \
            tests/test_backend_capabilities.py \
            tests/test_memory_budget.py \
            tests/test_runtime_capacity.py \
            tests/test_server_info_memory.py \
            tests/test_request_agent_frontend.py \
            tests/test_executor_supervision.py \
            tests/test_model_artifact_cache.py \
            tests/test_selective_safetensors.py \
            tests/test_route_capability_http.py \
            tests/scheduler_tests/test_contribution_gate_v2.py

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: fabi-network-${{ runner.os }}-${{ runner.arch }}
          path: native/fabi-network/target/wheels/*.whl
          if-no-files-found: error
