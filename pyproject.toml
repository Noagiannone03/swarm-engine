[build-system]
requires = ["setuptools>=68", "wheel", "poetry-core"]
build-backend = "poetry.core.masonry.api"


[project]
name = "parallax"
version = "0.1.2"
description = "Decentralised pipeline-parallel LLM serving with Sglang + MLX-LM + Lattica"
readme = "README.md"
requires-python = ">=3.10,<3.14"

dependencies = [
  "msgpack>=1.0.7",
  "safetensors>=0.5.1",
  # Hub 0.36 is Xet-aware and remains compatible with Transformers 4.x.
  # Range streaming itself uses hf-xet's public API, so workers can also run
  # with the Hub 1.x line selected by newer Transformers installations.
  "huggingface-hub>=0.36.2,<2.0.0",
  "hf-xet>=1.5.2,<1.6.0",
  "filelock>=3.12",
  "modelscope",
  "transformers>=4.57.1",
  "jinja2>=3.1.0",
  "numpy>=1.26",
  "pyzmq>=25.0",
  "psutil>=5.9.5",
  # NVIDIA's maintained NVML binding is the authoritative global-memory
  # signal on Windows/WDDM, where cudaMemGetInfo can ignore allocations made
  # by other processes. It is pure Python and imported only for CUDA workers.
  "nvidia-ml-py==13.610.43",
  "requests",
  "httpx[socks]>=0.26.0",
  "aiohttp",
  "uvicorn",
  "uvloop; sys_platform != 'win32'",
  "fastapi",
  "pydantic",
  # TUF is the model-registry trust root: threshold signatures, key rotation,
  # expiry and rollback/freeze protection. Keep the audited wire behaviour
  # reproducible across worker platforms instead of implementing crypto here.
  "tuf==7.0.0",
  "cryptography>=40.0.0",
  # vLLM 0.16 excludes the protobuf 6.31 family and current grpcio-reflection
  # requires the 7.35 runtime.  Generated Parallax messages remain compatible
  # with the supported protobuf 7 major line.
  "protobuf>=7.35.1,<8",
  "dijkstar==2.6.0",
  # Exact bounded route/slot capacity for the live autonomous placement
  # shortlist. NetworkX is pure Python and maintained across every worker OS.
  "networkx>=3.4,<4",
  "lattica==1.0.21",
  "orjson",
  # Mergeable bounded context-demand histograms. The signed DHT payload uses
  # the library's stable protobuf rather than a home-grown quantile sketch.
  "ddsketch==3.0.1",
]

[tool.poetry]
packages = [
  { include = "backend", from = "src" },
  { include = "fabi_network", from = "src" },
  { include = "parallax", from = "src" },
  { include = "parallax_extensions", from = "src" },
  { include = "parallax_utils", from = "src" },
  { include = "scheduling", from = "src" },
  { include = "swarm_protocol", from = "src" },
]

[project.scripts]
parallax = "parallax.cli:main"
fabi-swarm-registry = "swarm_protocol.registry_operator:main"
fabi-catalog-router = "swarm_protocol.catalog_router:main"
fabi-request-agent = "backend.server.request_agent_frontend:main"
fabi-build-onnx-stages = "swarm_protocol.onnx_stage_builder:main"

[project.optional-dependencies]

mac = [
  "nanobind==2.12.0",
  "torch==2.8.0",
  "mlx-lm==0.31.3",
  "mlx==0.31.2",
]

gpu = [
  "sglang[all]==0.5.12",
  "kernels<0.15",
  "accelerate",
  "mlx-lm==0.31.3",
  "mlx[cpu]==0.31.2",
]

vllm = [
  "vllm==0.14.0; sys_platform != 'win32'",
  "mlx-lm==0.31.3; sys_platform != 'win32'",
  "mlx[cpu]==0.31.2; sys_platform != 'win32'",
]

benchmark = [
  "transformers",
  "tqdm",
  "datasets",
  "pillow",
]

portable-builder = [
  # Keep graph construction out of the worker's mandatory environment.  The
  # publisher pins Microsoft's exporter revision separately in every signed
  # execution plan.
  "onnx==1.22.0",
  "onnxruntime>=1.23,<2",
]

dev = [
  "black>=24.3",
  "cmake>=3.27",
  "ninja>=1.11",
  "ruff>=0.4",
  "setuptools>=68",
  "pytest>=8.2",
  "pytest-mock>=3.14",
  "pytest-cov>=5.0",
  "pre-commit>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]                # put your code under ./src/…

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E501"]              # line length handled by Black
