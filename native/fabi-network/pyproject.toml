[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fabi-network-native"
version = "0.1.0"
requires-python = ">=3.10"
description = "Native authenticated QUIC transport for Fabi"

[tool.maturin]
features = ["python-extension"]
module-name = "fabi_network_native"
